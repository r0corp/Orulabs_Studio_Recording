plugins {
    id 'com.android.application'
}

android {
    namespace 'id.orulabs.orustudio'
    compileSdk 34

    defaultConfig {
        applicationId "id.orulabs.orustudio"
        minSdk 29          // perlu AudioPlaybackCapture (Android 10+)
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures { buildConfig true }

    // tampilan HP (src/main/assets/app) + mesin suara versi laptop (web/: dsp.js, magic.js, ekspor.js, ikon, font)
    sourceSets { main { assets.srcDirs = ['src/main/assets', '../../web'] } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
