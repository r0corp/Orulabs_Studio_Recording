<!doctype html>
<html lang="id" data-ol-skin="glass-dark" data-warna="biru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orulabs Studio Recording</title>
<link rel="icon" href="assets/brand/ikon-studio.svg">
<link rel="stylesheet" href="vendor/inter/inter.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <!-- Bar atas -->
  <header class="topbar glass">
    <div class="brandwrap">
      <img class="logo" src="assets/brand/ikon-studio.svg" alt="">
      <div class="brand">
        <div class="judul"><img class="wm-dark" src="assets/brand/orulabs-logo-white.png" alt="Orulabs"><img class="wm-light" src="assets/brand/orulabs-logo.png" alt="Orulabs"><b data-t="nama">Studio Recording</b></div>
        <span data-t="tagline">Perekaman vokal profesional</span>
      </div>
    </div>
    <div class="searchrow">
      <button class="lib" id="btnPustaka" data-t-title="playlistSaya"><i class="bi bi-collection-play"></i></button>
      <form class="search" id="cari"><i class="bi bi-youtube"></i><input id="kata" data-t-ph="cari" autocomplete="off"><button type="submit" data-t="cariBtn">Cari</button>
        <div class="riwayat-cari glass" id="riwayatCari" hidden></div></form>
    </div>
    <div class="tools">
      <button class="gear" id="btnPengaturan"><i class="bi bi-gear"></i><span data-t="pengaturan">Pengaturan</span><span class="titik" id="titikStatus"></span></button>
    </div>
  </header>

  <div class="stage">
    <!-- YouTube: video kiri, kolom kanan seperti YouTube -->
    <section class="card glass yt">
      <div class="ytgrid">
        <div class="ytkiri">
          <div class="player" id="player">
            <div id="ytPlayer"></div>
            <div class="kosong" id="ytKosong"><div><i class="bi bi-youtube"></i><b data-t="kosongJudul"></b><span data-t="kosongKet"></span></div></div>
          </div>
          <div class="now" style="margin-bottom:0">
            <div><b id="ytJudul" data-t="belumLagu"></b><a class="chlink" id="ytChannel" style="font-size:12px"></a><span class="muted" style="font-size:11.5px" id="ytInfo"></span></div>
            <div class="ctl">
              <button class="btn" id="ytPrev"><i class="bi bi-skip-backward-fill"></i></button>
              <button class="btn primary" id="ytPlay"><i class="bi bi-play-fill"></i><span data-t="putar">Putar</span></button>
              <button class="btn" id="ytNext"><i class="bi bi-skip-forward-fill"></i></button>
            </div>
          </div>
        </div>
        <div class="kolom" id="kolom"></div>
      </div>
    </section>

    <!-- Perekam -->
    <section class="card glass rec">
      <div class="card-h"><h3><i class="bi bi-record-circle"></i><span data-t="perekam">Perekam</span></h3><span class="rec-pill diam" id="recPill"><i></i><span data-t="siap">SIAP</span></span></div>
      <div class="ready">
        <div id="cekInput"><i class="bi bi-check-circle-fill"></i><span></span></div>
        <div id="cekOutput"><i class="bi bi-check-circle-fill"></i><span></span></div>
        <div id="cekLevel"><i class="bi bi-check-circle-fill"></i><span></span></div>
        <div id="cekYt"><i class="bi bi-check-circle-fill"></i><span></span></div>
      </div>
      <div class="fill"></div>
      <div class="timer" id="timer">00:00</div>
      <div class="muted" id="timerKet" data-t="tekanRekam"></div>
      <div class="transport">
        <button class="tbtn" id="btnStop"><i class="bi bi-stop-fill"></i></button>
        <button class="tbtn big" id="btnRekam"><i class="bi bi-mic-fill"></i></button>
      </div>
      <div class="label" data-t="levelSuara">Level suara</div>
      <div class="meter" id="meter"></div>
      <div class="scale"><span>-60</span><span>-30</span><span>-12</span><span>-3</span><span>0 dB</span></div>
      <div class="fill"></div>
      <div class="field">
        <div class="row"><span class="label" data-t="volInput">Volume input</span><b style="font-size:12px" id="volNilai">–</b></div>
        <input type="range" id="volInput" min="0" max="100" value="90">
      </div>
      <div class="perangkat" id="ringkasPerangkat"></div>
    </section>

    <!-- Rekaman -->
    <section class="card glass wave">
      <div class="files">
        <div class="card-h"><h3><i class="bi bi-collection-play"></i><span data-t="rekamanSaya">Rekaman saya</span></h3><span class="muted" style="font-size:11px" id="jumlah"></span></div>
        <div class="list" id="daftar"></div>
      </div>
      <div class="sep"></div>
      <div class="editor">
        <div class="card-h">
          <h3><button class="putar-kecil" id="btnPutar"><i class="bi bi-play-fill"></i></button><span id="namaRekaman" data-t="belumDipilih"></span></h3>
          <div style="display:flex;gap:6px;align-items:center">
            <button class="btn rapikan" id="btnRapikan"><i class="bi bi-stars"></i><span data-t="rapikanOto"></span></button>
            <div class="ab" id="ab"><button data-v="asli" class="on" data-t="asli">Asli</button><button data-v="studio" data-t="studio">Studio</button></div>
            <button class="btn" id="btnGanti"><i class="bi bi-pencil"></i></button>
            <button class="btn" id="btnFolder"><i class="bi bi-folder2-open"></i></button>
            <button class="btn" id="btnHapus"><i class="bi bi-trash3"></i></button>
          </div>
        </div>
        <div class="wave-wrap" id="gelombang">
          <canvas id="wave"></canvas>
          <div class="trim l" id="trimL"></div><div class="trim r" id="trimR"></div>
          <div class="handle" id="hL"></div><div class="handle" id="hR"></div>
          <div class="kosong" id="waveKosong"></div>
        </div>
        <div class="ruler" id="penggaris"></div>
      </div>
    </section>

    <!-- Studio / Analisa -->
    <section class="card glass side">
      <div class="tabs">
        <button data-tab="studio" class="on"><i class="bi bi-magic"></i><span data-t="studio">Studio</span></button>
        <button data-tab="analisa"><i class="bi bi-graph-up"></i><span data-t="analisa">Analisa</span></button>
      </div>
      <div class="pane on" id="studio">
        <div class="presets" id="preset"><button data-p="natural">Natural</button><button data-p="pop" class="on">Pop</button><button data-p="ballad">Ballad</button><button data-p="rock">Rock</button><button data-p="dangdut">Dangdut</button></div>
        <div class="scroll">
          <div class="fx" data-fx="desis"><div class="row"><i class="f bi bi-wind"></i><div><b data-t="fxDesis"></b><span data-t="fxDesisK"></span></div><span class="sw"></span></div><input type="range" min="0" max="100" value="40"></div>
          <div class="fx" data-fx="penyeimbang"><div class="row"><i class="f bi bi-arrows-collapse"></i><div><b data-t="fxPenyeimbang"></b><span data-t="fxPenyeimbangK"></span></div><span class="sw"></span></div><input type="range" min="0" max="100" value="40"></div>
          <div class="fx" data-fx="eq"><div class="row"><i class="f bi bi-sliders2"></i><div><b data-t="fxEq"></b><span data-t="fxEqK"></span></div><span class="sw"></span></div><input type="range" min="0" max="100" value="50"></div>
          <div class="fx" data-fx="desisS"><div class="row"><i class="f bi bi-soundwave"></i><div><b data-t="fxS"></b><span data-t="fxSK"></span></div><span class="sw off"></span></div></div>
          <div class="fx" data-fx="gema"><div class="row"><i class="f bi bi-broadcast"></i><div><b data-t="fxGema"></b><span data-t="fxGemaK"></span></div><span class="sw"></span></div><input type="range" min="0" max="100" value="22"></div>
          <div class="fx" data-fx="kilau"><div class="row"><i class="f bi bi-brightness-high"></i><div><b data-t="fxKilau"></b><span data-t="fxKilauK"></span></div><span class="sw off"></span></div><input type="range" min="0" max="100" value="40"></div>
          <div class="fx" data-fx="keraskan"><div class="row"><i class="f bi bi-volume-up"></i><div><b data-t="fxKeras"></b><span data-t="fxKerasK"></span></div><span class="sw"></span></div></div>
          <div class="fx" data-fx="nada"><div class="row"><i class="f bi bi-music-note-beamed"></i><div><b data-t="fxNada"></b><span data-t="fxNadaK"></span></div><b style="flex:none;color:var(--p)" id="nadaNilai">0</b></div><input type="range" min="-4" max="4" step="1" value="0"></div>
          <div class="fx lock"><div class="row"><i class="f bi bi-lock"></i><div><b data-t="fxKunci"></b><span data-t="fxKunciK"></span></div></div></div>
        </div>
        <div class="actions">
          <button class="btn" id="btnDengar"><i class="bi bi-headphones"></i><span data-t="dengar"></span></button>
          <button class="btn primary" id="btnSimpanStudio"><i class="bi bi-download"></i><span data-t="simpanHasil"></span></button>
        </div>
      </div>
      <div class="pane" id="analisa">
        <div class="stats">
          <div class="stat"><span class="label" data-t="pecah"></span><b id="stPecah">–</b><em id="stPecahKet"></em></div>
          <div class="stat"><span class="label" data-t="senyap"></span><b id="stSenyap">–</b><em id="stSenyapKet"></em></div>
          <div class="stat"><span class="label" data-t="bass"></span><b id="stBass">–</b><em id="stBassKet"></em></div>
          <div class="stat"><span class="label" data-t="vokalJelas"></span><b id="stJelas">–</b><em id="stJelasKet"></em></div>
        </div>
        <div class="label" style="margin-top:14px" data-t="keseimbangan"></div>
        <div class="bands" id="bands"></div>
        <div class="tip" id="tip"><i class="bi bi-lightbulb-fill"></i><div data-t="pilihUntukAnalisa"></div></div>
      </div>
    </section>
  </div>
</div>

<!-- Panel Pengaturan -->
<div class="laci-latar" id="laci">
  <div class="laci glass">
    <div class="atas"><h3><i class="bi bi-gear"></i><span data-t="pengaturan"></span></h3><button class="mini" id="tutupPengaturan" style="font-size:18px"><i class="bi bi-x-lg"></i></button></div>
    <div class="badan">
      <div class="sek">
        <div class="baris" style="margin-top:0"><h4 data-t="modeAudio" style="margin:0"></h4><span class="chip" id="siap"><span class="dot" id="siapDot"></span><span id="siapTeks">…</span></span></div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px" data-t="modeAudioKet"></div>
        <div class="profil" data-profil="rumah">
          <div class="kepala"><i class="bi bi-sliders"></i><div><b data-t="modeRumah"></b><small data-t="rumahKet"></small></div><button class="btn kecil" data-aktifkan="rumah"></button></div>
          <div class="lbl" data-t="rekamDari"></div><label class="select"><i class="bi bi-usb-symbol" style="color:var(--p)"></i><select data-pilih="rumah-input"></select><i class="bi bi-chevron-down"></i></label>
          <div class="lbl" data-t="speakerYoutube"></div><label class="select"><i class="bi bi-youtube" style="color:var(--p)"></i><select data-pilih="rumah-output"></select><i class="bi bi-chevron-down"></i></label>
          <div class="lbl" data-t="putarRekamanKe"></div><label class="select"><i class="bi bi-speaker" style="color:var(--p)"></i><select data-pilih="rumah-putar"></select><i class="bi bi-chevron-down"></i></label>
        </div>
        <div class="profil" data-profil="laptop">
          <div class="kepala"><i class="bi bi-laptop"></i><div><b data-t="modeLaptop"></b><small data-t="laptopKet"></small></div><button class="btn kecil" data-aktifkan="laptop"></button></div>
          <div class="lbl" data-t="rekamDari"></div><label class="select"><i class="bi bi-mic" style="color:var(--p)"></i><select data-pilih="laptop-input"></select><i class="bi bi-chevron-down"></i></label>
          <div class="lbl" data-t="speakerYoutube"></div><label class="select"><i class="bi bi-youtube" style="color:var(--p)"></i><select data-pilih="laptop-output"></select><i class="bi bi-chevron-down"></i></label>
          <div class="lbl" data-t="putarRekamanKe"></div><label class="select"><i class="bi bi-speaker" style="color:var(--p)"></i><select data-pilih="laptop-putar"></select><i class="bi bi-chevron-down"></i></label>
        </div>
        <div class="baris"><span><span data-t="keraskanOto"></span><small data-t="keraskanOtoK"></small></span><span class="sw" id="swKeraskan"></span></div>
        <div class="baris"><span><span data-t="sinkronYt"></span><small data-t="sinkronYtK"></small></span><span class="sw" id="swSinkron"></span></div>
        <div class="baris"><span><span data-t="autoplay"></span><small data-t="autoplayK"></small></span><span class="sw" id="swAutoplay"></span></div>
        <div class="baris"><span></span><button class="btn kecil" id="btnTesSuara"><i class="bi bi-volume-up"></i><span data-t="tesSuara"></span></button></div>
      </div>
      <div class="sek">
        <h4 data-t="tampilan"></h4>
        <div style="font-size:13px;margin-bottom:8px" data-t="warnaTema"></div>
        <div class="warna-pilih" id="warna">
          <button data-w="biru"><i style="background:#0190fb"></i>Biru</button>
          <button data-w="ungu"><i style="background:#8b5cf6"></i>Ungu</button>
          <button data-w="tosca"><i style="background:#14b8a6"></i>Tosca</button>
          <button data-w="senja"><i style="background:#f97316"></i>Senja</button>
          <button data-w="mawar"><i style="background:#f43f5e"></i>Mawar</button>
        </div>
        <div style="font-size:13px;margin:14px 0 8px" data-t="mode"></div>
        <div class="seg" id="tema"><button data-m="glass-dark"><i class="bi bi-moon-stars-fill"></i><span data-t="gelap"></span></button><button data-m="glass-light"><i class="bi bi-sun-fill"></i><span data-t="terang"></span></button><button data-m="auto"><i class="bi bi-circle-half"></i><span data-t="ikutiWindows"></span></button></div>
      </div>
      <div class="sek">
        <h4 data-t="bahasa"></h4>
        <div class="seg" id="bahasa"><button data-l="id">Indonesia</button><button data-l="en">English</button></div>
      </div>
      <div class="sek">
        <h4 data-t="penyimpanan"></h4>
        <div class="baris"><span><span data-t="folder"></span><small id="folderRekaman"></small></span><button class="btn kecil" id="btnBukaFolder"><i class="bi bi-folder2-open"></i><span data-t="buka"></span></button></div>
      </div>
      <div class="sek">
        <div class="ikonbesar"><img src="assets/brand/ikon-studio.svg" alt=""><div style="flex:1"><b>Orulabs Studio Recording</b><div style="font-size:12px;color:var(--muted)"><span data-t="versi"></span> <span id="versiApp">–</span> · © Orulabs</div></div>
          <button class="btn kecil" id="btnCekUpdate"><i class="bi bi-arrow-repeat"></i><span data-t="cekUpdate"></span></button></div>
        <div class="update-info" id="infoUpdate" hidden>
          <div><b id="judulUpdate"></b><small id="catatanUpdate"></small></div>
          <button class="btn primary kecil" id="btnPasangUpdate"><i class="bi bi-download"></i><span data-t="updateSekarang"></span></button>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
