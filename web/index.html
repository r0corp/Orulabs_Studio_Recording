<!doctype html>
<html lang="id" data-ol-skin="glass-dark" data-warna="biru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orulabs Studio Recording</title>
<link rel="icon" href="assets/brand/ikon-studio.svg">
<link rel="stylesheet" href="vendor/inter/inter.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <!-- Bar atas -->
  <header class="topbar glass">
    <div class="brandwrap">
      <img class="logo" src="assets/brand/ikon-studio.svg" alt="">
      <div class="brand">
        <div class="judul"><img class="wm-dark" src="assets/brand/orulabs-logo-white.png" alt="Orulabs"><img class="wm-light" src="assets/brand/orulabs-logo.png" alt="Orulabs"><b data-t="nama">Studio Recording</b></div>
        <span data-t="tagline">Perekaman vokal profesional</span>
      </div>
    </div>
    <div class="searchrow">
      <button class="lib" id="btnPustaka" data-t-title="playlistSaya"><i class="bi bi-collection-play"></i></button>
      <form class="search" id="cari"><i class="bi bi-youtube"></i><input id="kata" data-t-ph="cari" autocomplete="off"><button type="submit" data-t="cariBtn">Cari</button>
        <div class="riwayat-cari glass" id="riwayatCari" hidden></div></form>
    </div>
    <div class="tools">
      <div class="mode-kerja" id="modeKerja">
        <button data-m="youtube" data-t-title="modeYtKet"><i class="bi bi-youtube"></i><span>YouTube</span></button>
        <button data-m="rekam" data-t-title="modeRekamKet"><i class="bi bi-record-circle"></i><span data-t="modeRekam">Rekam</span></button>
      </div>
      <button class="gear" id="btnPengaturan"><i class="bi bi-gear"></i><span data-t="pengaturan">Pengaturan</span><span class="titik" id="titikStatus"></span></button>
    </div>
  </header>

  <div class="stage">
    <!-- YouTube: video kiri, kolom kanan seperti YouTube -->
    <section class="card glass yt">
      <div class="ytgrid">
        <div class="ytkiri">
          <div class="player" id="player">
            <div id="ytPlayer"></div>
            <div class="kosong" id="ytKosong"><div><i class="bi bi-youtube"></i><b data-t="kosongJudul"></b><span data-t="kosongKet"></span></div></div>
          </div>
          <div class="now" style="margin-bottom:0">
            <div><b id="ytJudul" data-t="belumLagu"></b><a class="chlink" id="ytChannel" style="font-size:12px"></a><span class="muted" style="font-size:11.5px" id="ytInfo"></span></div>
            <div class="ctl">
              <button class="btn" id="ytPrev"><i class="bi bi-skip-backward-fill"></i></button>
              <button class="btn primary" id="ytPlay"><i class="bi bi-play-fill"></i><span data-t="putar">Putar</span></button>
              <button class="btn" id="ytNext"><i class="bi bi-skip-forward-fill"></i></button>
            </div>
          </div>
        </div>
        <div class="kolom" id="kolom"></div>
      </div>
    </section>

    <!-- Perekam -->
    <section class="card glass rec">
      <div class="card-h"><h3><i class="bi bi-record-circle"></i><span data-t="perekam">Perekam</span></h3><span class="rec-pill diam" id="recPill"><i></i><span data-t="siap">SIAP</span></span></div>
      <div class="rec-isi">
        <div class="vmeter kapsul" id="vmeter">
          <div></div><b class="ang" id="angIn">–</b><b class="ang" id="angVok">–</b><b class="ang" id="angMus">–</b>
          <div class="skala"><b style="top:0%">0</b><b style="top:10%">-6</b><b style="top:30%">-18</b><b style="top:60%">-36</b><b style="top:100%">-60</b></div>
          <div class="kap" id="barIn"><div class="isi"></div><div class="tahan"></div></div>
          <div class="kap" id="barVok"><div class="isi"></div><div class="tahan"></div></div>
          <div class="kap" id="barMus"><div class="isi"></div><div class="tahan"></div></div>
          <div></div>
          <div class="ik in tip-atas" data-tip-t="tipMtrIn"><i class="bi bi-soundwave"></i></div>
          <div class="ik tip-atas" data-tip-t="tipMtrVok"><i class="bi bi-mic-fill"></i></div>
          <div class="ik tip-atas" data-tip-t="tipMtrMus"><i class="bi bi-music-note-beamed"></i></div>
        </div>
        <div class="rec-kanan">
          <div class="ready">
            <div id="cekInput"><i class="bi bi-check-circle-fill"></i><span></span></div>
            <div id="cekOutput"><i class="bi bi-check-circle-fill"></i><span></span></div>
            <div id="cekLevel"><i class="bi bi-check-circle-fill"></i><span></span></div>
            <div id="cekYt"><i class="bi bi-check-circle-fill"></i><span></span></div>
          </div>
          <div class="timer" id="timer">00:00</div>
          <div class="muted" id="timerKet" data-t="tekanRekam"></div>
          <div class="tombol-a">
            <svg viewBox="0 0 100 100"><circle class="jalur" cx="50" cy="50" r="46"/><circle class="cincin" id="cincinRekam" cx="50" cy="50" r="46"/></svg>
            <button class="rekam-a" id="btnRekam"><i class="bi bi-mic-fill"></i></button>
          </div>
          <button id="btnStop" hidden></button>
          <div class="field">
            <div class="row"><span class="label" data-t="volInput">Volume input</span><b style="font-size:12px" id="volNilai">–</b></div>
            <input type="range" id="volInput" min="0" max="100" value="90">
          </div>
          <div class="perangkat" id="ringkasPerangkat"></div>
        </div>
      </div>
    </section>

    <!-- Rekaman -->
    <section class="card glass wave">
      <div class="files">
        <div class="card-h"><h3><i class="bi bi-collection-play"></i><span data-t="rekamanSaya">Rekaman saya</span><span class="muted" style="font-size:11px;font-weight:500" id="jumlah"></span></h3><button class="btn ikon-saja kecil-impor" id="btnImpor" data-tip-t="tipImpor"><i class="bi bi-plus-lg"></i></button></div>
        <div class="list" id="daftar"></div>
      </div>
      <div class="sep"></div>
      <div class="editor">
        <div class="card-h">
          <h3><button class="putar-kecil" id="btnPutar" data-tip-t="tipPutar"><i class="bi bi-play-fill"></i></button><div class="ab" id="ab"><button data-v="asli" class="on" data-t="asli" data-tip-t="tipAsli">Asli</button><button data-v="studio" data-t="studio" data-tip-t="tipStudio">Studio</button></div><span id="namaRekaman" data-t="belumDipilih"></span></h3>
          <div style="display:flex;gap:6px;align-items:center">
            <button class="btn rapikan" id="btnRapikan" data-tip-t="tipRapikan"><i class="bi bi-sliders"></i><span data-t="rapikanOto"></span></button>
            <button class="btn magic" id="btnMagic" data-tip-t="tipMagic"><i class="bi bi-stars"></i><span data-t="magicVocal"></span></button>
            <button class="btn primary ikon-saja" id="btnSimpanAtas" data-tip-t="simpan"><i class="bi bi-download"></i></button>
            <button class="btn ikon-saja wa" id="btnWa" data-tip-t="tipWa"><i class="bi bi-whatsapp"></i></button>
            <button class="btn" id="btnGanti" data-tip-t="tipGanti"><i class="bi bi-pencil"></i></button>
            <button class="btn" id="btnFolder" data-tip-t="tipFolder"><i class="bi bi-folder2-open"></i></button>
            <button class="btn" id="btnHapus" data-tip-t="tipHapus"><i class="bi bi-trash3"></i></button>
          </div>
        </div>
        <div class="baris-mix" id="barisMix" hidden>
          <label class="vol-putar" data-tip-t="volPutar"><i class="bi bi-volume-up" id="ikonVolPutar"></i><span data-t="volume"></span><input type="range" id="volPutar" min="0" max="200" step="5" value="100"><b id="volPutarNilai">100%</b></label>
          <div class="pemisah"></div>
          <div class="mix-dua" id="mixDua">
            <label data-tip-t="tipMixVokal"><i class="bi bi-mic-fill"></i><span data-t="vokal"></span><input type="range" id="mixVokal" min="0" max="150" step="5" value="100"><b id="mixVokalNilai">100%</b></label>
            <label data-tip-t="tipMixMusik"><i class="bi bi-music-note-beamed"></i><span data-t="musik"></span><input type="range" id="mixMusik" min="0" max="150" step="5" value="70"><b id="mixMusikNilai">70%</b></label>
            <div class="sinkron" data-tip-t="tipSinkron"><i class="bi bi-stopwatch"></i><span data-t="sinkron"></span><button id="sinkronKurang">−</button><b id="sinkronNilai">0 ms</b><button id="sinkronTambah">+</button></div>
          </div>
          <div class="mix-satu" id="mixSatu">
            <i class="bi bi-sliders2"></i><span data-t="keseimbangan"></span>
            <small data-t="musik"></small><input type="range" id="fokusVokal" min="-100" max="100" step="10" value="0"><small data-t="vokal"></small><b id="fokusNilai">0</b>
            <em data-t="satuJalurKet"></em>
          </div>
        </div>
        <div class="mv-status" id="mvStatus" hidden><span class="pill-ok"><i class="bi bi-stars"></i><b id="mvStatusJudul"></b></span><em id="mvStatusKet"></em></div>
        <div class="gaya-rapikan" id="gayaRapikan" hidden>
          <span data-t="pilihHasil"></span>
          <button data-g="1"><b>1</b><span data-t="gaya1"></span></button>
          <button data-g="2"><b>2</b><span data-t="gaya2"></span></button>
          <button data-g="3"><b>3</b><span data-t="gaya3"></span></button>
          <em id="gayaKet"></em>
        </div>
        <div class="bilah-potong" id="bilahPotong" hidden>
          <i class="bi bi-scissors"></i><span class="waktu"><span id="potongWaktu"></span><small id="potongDurasi"></small></span>
          <span class="isi" id="potonganList"></span>
          <button class="btn" id="ptAwal" data-tip-t="tipPtAwal"><i class="bi bi-skip-start"></i><span data-t="ptAwal"></span></button>
          <button class="btn" id="ptAkhir" data-tip-t="tipPtAkhir"><span data-t="ptAkhir"></span><i class="bi bi-skip-end"></i></button>
          <div class="sep2"></div>
          <button class="btn" id="ptPutar"><i class="bi bi-play-fill"></i><span data-t="ptPutar"></span></button>
          <button class="btn" id="ptReset"><i class="bi bi-arrow-counterclockwise"></i><span data-t="ptReset"></span></button>
          <button class="btn kuning" id="ptSimpan"><i class="bi bi-scissors"></i><span data-t="ptSimpan"></span></button>
        </div>
        <div class="wave-wrap" id="gelombang"><div class="potong-label" id="lblAwal" hidden></div><div class="potong-label" id="lblAkhir" hidden></div><div class="ringkas-level" id="ringkasLevel" hidden></div>
          <canvas id="wave"></canvas>
          <div class="trim l" id="trimL"></div><div class="trim r" id="trimR"></div>
          <div class="handle" id="hL"></div><div class="handle" id="hR"></div>
          <div class="kosong" id="waveKosong"></div>
        </div>
        <div class="ruler" id="penggaris"></div>
      </div>
    </section>

    <!-- Studio / Analisa -->
    <section class="card glass rel-samping" id="relSamping">
      <button id="btnBukaSamping" data-t-title="tampilkanPanel"><i class="bi bi-chevron-double-left"></i></button>
      <button class="utama" data-buka="studio" data-t-title="studio"><i class="bi bi-magic"></i></button>
      <button data-buka="analisa" data-t-title="analisa"><i class="bi bi-graph-up"></i></button>
      <span class="vlabel">STUDIO · ANALISA</span>
    </section>
    <section class="card glass side">
      <div class="baris-tutup"><div class="tabs">
        <button data-tab="studio" class="on"><i class="bi bi-magic"></i><span data-t="studio">Studio</span></button>
        <button data-tab="analisa"><i class="bi bi-graph-up"></i><span data-t="analisa">Analisa</span></button>
      </div><button class="tutup-samping" id="btnTutupSamping" data-t-title="sembunyikanPanel"><i class="bi bi-chevron-double-right"></i></button></div>
      <div class="pane on" id="studio">
        <div class="presets" id="preset"><button data-p="natural">Natural</button><button data-p="pop" class="on">Pop</button><button data-p="ballad">Ballad</button><button data-p="rock">Rock</button><button data-p="dangdut">Dangdut</button></div>
        <div class="scroll">
          <div class="fx" data-fx="desis"><div class="row"><i class="f bi bi-wind"></i><div><b data-t="fxDesis"></b><span data-t="fxDesisK"></span></div><span class="sw"></span></div><input type="range" min="0" max="100" value="40"></div>
          <div class="fx" data-fx="penyeimbang"><div class="row"><i class="f bi bi-arrows-collapse"></i><div><b data-t="fxPenyeimbang"></b><span data-t="fxPenyeimbangK"></span></div><span class="sw"></span></div><input type="range" min="0" max="100" value="40"></div>
          <div class="fx" data-fx="eq"><div class="row"><i class="f bi bi-sliders2"></i><div><b data-t="fxEq"></b><span data-t="fxEqK"></span></div><span class="sw"></span></div><input type="range" min="0" max="100" value="50"></div>
          <div class="fx" data-fx="desisS"><div class="row"><i class="f bi bi-soundwave"></i><div><b data-t="fxS"></b><span data-t="fxSK"></span></div><span class="sw off"></span></div></div>
          <div class="fx" data-fx="gema"><div class="row"><i class="f bi bi-broadcast"></i><div><b data-t="fxGema"></b><span data-t="fxGemaK"></span></div><span class="sw"></span></div><input type="range" min="0" max="100" value="22"></div>
          <div class="fx" data-fx="kilau"><div class="row"><i class="f bi bi-brightness-high"></i><div><b data-t="fxKilau"></b><span data-t="fxKilauK"></span></div><span class="sw off"></span></div><input type="range" min="0" max="100" value="40"></div>
          <div class="fx" data-fx="keraskan"><div class="row"><i class="f bi bi-volume-up"></i><div><b data-t="fxKeras"></b><span data-t="fxKerasK"></span></div><span class="sw"></span></div></div>
          <div class="fx" data-fx="nada"><div class="row"><i class="f bi bi-music-note-beamed"></i><div><b data-t="fxNada"></b><span data-t="fxNadaK"></span></div><b style="flex:none;color:var(--p)" id="nadaNilai">0</b></div><input type="range" min="-4" max="4" step="1" value="0"></div>
          <div class="fx lock"><div class="row"><i class="f bi bi-lock"></i><div><b data-t="fxKunci"></b><span data-t="fxKunciK"></span></div></div></div>
        </div>
        <div class="actions">
          <button class="btn" id="btnDengar"><i class="bi bi-headphones"></i><span data-t="dengar"></span></button>
          <button class="btn primary" id="btnSimpanStudio"><i class="bi bi-download"></i><span data-t="simpanHasil"></span></button>
        </div>
      </div>
      <div class="pane" id="analisa">
        <div class="nada-kartu" id="kartuNada" hidden>
          <h5><i class="bi bi-graph-up"></i><span data-t="grafikNada"></span><span class="nav"><button id="nadaKiri"><i class="bi bi-chevron-left"></i></button><b id="nadaWaktu"></b><button id="nadaKanan"><i class="bi bi-chevron-right"></i></button></span></h5>
          <canvas id="kanvasNada"></canvas>
          <div class="nada-leg"><span><i class="a"></i><span data-t="lgAsli"></span></span><span><i class="m"></i><span data-t="lgMagic"></span></span><span><i class="k"></i><span id="lgKunci"></span></span></div>
          <div class="nada-stat"><div><b id="stNadaTepat">–</b><small data-t="stTepat"></small></div><div><b id="stNadaRapi">–</b><small data-t="stDikoreksi"></small></div><div><b id="stNadaSisa">–</b><small data-t="stSisa"></small></div></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="label" data-t="pecah"></span><b id="stPecah">–</b><em id="stPecahKet"></em></div>
          <div class="stat"><span class="label" data-t="senyap"></span><b id="stSenyap">–</b><em id="stSenyapKet"></em></div>
          <div class="stat"><span class="label" data-t="bass"></span><b id="stBass">–</b><em id="stBassKet"></em></div>
          <div class="stat"><span class="label" data-t="vokalJelas"></span><b id="stJelas">–</b><em id="stJelasKet"></em></div>
        </div>
        <div class="label" style="margin-top:14px" data-t="keseimbangan"></div>
        <div class="bands" id="bands"></div>
        <div class="tip" id="tip"><i class="bi bi-lightbulb-fill"></i><div data-t="pilihUntukAnalisa"></div></div>
      </div>
    </section>
  </div>
</div>

<!-- Panel Pengaturan -->
<div class="laci-latar" id="laci">
  <div class="laci glass">
    <div class="atas"><h3><i class="bi bi-gear"></i><span data-t="pengaturan"></span></h3><button class="mini" id="tutupPengaturan" style="font-size:18px"><i class="bi bi-x-lg"></i></button></div>
    <div class="badan">

      <div class="sek">
        <h4><span data-t="modeAudio"></span><span class="chip status" id="siap"><span class="dot" id="siapDot"></span><span id="siapTeks">…</span></span></h4>
        <div class="seg besar" id="pilihModeAudio"><button data-mode="rumah"><i class="bi bi-sliders"></i><span data-t="modeRumah"></span></button><button data-mode="laptop"><i class="bi bi-laptop"></i><span data-t="modeLaptop"></span></button></div>
        <div class="pg-kotak" style="margin-top:10px">
          <div class="pg-baris"><i class="bi bi-mic"></i><div class="nm" data-t="rekamDari"></div><div class="dd" data-pilih-arah="input"></div></div>
          <div class="pg-baris"><i class="bi bi-youtube"></i><div class="nm" data-t="speakerYoutube"></div><div class="dd" data-pilih-arah="output"></div></div>
          <div class="pg-baris"><i class="bi bi-speaker"></i><div class="nm" data-t="putarRekamanKe"></div><div class="dd" data-pilih-arah="putar"></div></div>
        </div>
        <div class="pg-tips"><i class="bi bi-lightbulb"></i><span data-t="tipsEfek"></span><button id="btnSetelanSuara"><span data-t="bukaSetelan"></span> <i class="bi bi-box-arrow-up-right"></i></button></div>
      </div>

      <div class="sek">
        <h4 data-t="sekRekam"></h4>
        <div class="pg-kotak">
          <div class="pg-baris"><i class="bi bi-graph-up-arrow"></i><div class="nm"><span data-t="keraskanSingkat"></span><small data-t="keraskanSingkatK"></small></div><span class="sw" id="swKeraskan"></span></div>
          <div class="pg-baris"><i class="bi bi-link-45deg"></i><div class="nm"><span data-t="sinkronSingkat"></span><small data-t="sinkronSingkatK"></small></div><span class="sw" id="swSinkron"></span></div>
          <div class="pg-baris"><i class="bi bi-layers"></i><div class="nm"><span data-t="duaJalur"></span><small data-t="duaJalurK"></small></div><span class="sw" id="swDuaJalur"></span></div>
          <div class="pg-baris"><i class="bi bi-collection-play"></i><div class="nm"><span data-t="autoplay"></span><small data-t="autoplaySingkatK"></small></div><span class="sw" id="swAutoplay"></span></div>
          <div class="pg-baris"><i class="bi bi-volume-up"></i><div class="nm" data-t="tesSuara"></div><button class="btn kecil" id="btnTesSuara"><i class="bi bi-play-fill"></i><span data-t="tes"></span></button></div>
        </div>
      </div>

      <div class="sek">
        <h4 data-t="sekTampilan"></h4>
        <div class="pg-kotak">
          <div class="pg-baris"><i class="bi bi-palette"></i><div class="nm" data-t="warna"></div>
            <div class="pg-warna" id="warna">
              <button data-w="biru" title="Biru"><i style="background:#0190fb"></i></button>
              <button data-w="ungu" title="Ungu"><i style="background:#8b5cf6"></i></button>
              <button data-w="tosca" title="Tosca"><i style="background:#14b8a6"></i></button>
              <button data-w="senja" title="Senja"><i style="background:#f97316"></i></button>
              <button data-w="mawar" title="Mawar"><i style="background:#f43f5e"></i></button>
            </div></div>
          <div class="pg-baris"><i class="bi bi-circle-half"></i><div class="nm" data-t="tema"></div>
            <div class="seg ikon" id="tema"><button data-m="glass-dark" data-t-title="gelap"><i class="bi bi-moon-stars-fill"></i></button><button data-m="glass-light" data-t-title="terang"><i class="bi bi-sun-fill"></i></button><button data-m="auto" data-t-title="ikutiWindows"><i class="bi bi-display"></i></button></div></div>
          <div class="pg-baris"><i class="bi bi-translate"></i><div class="nm" data-t="bahasa"></div><div class="dd kecil" id="ddBahasa"></div></div>
        </div>
      </div>

      <div class="sek">
        <h4 data-t="sekLainnya"></h4>
        <div class="pg-kotak">
          <div class="pg-baris"><i class="bi bi-folder2"></i><div class="nm"><span data-t="folder"></span><small id="folderRekaman"></small></div><button class="btn kecil ikon-saja" id="btnPilihFolder" data-tip-t="tipPilihFolder"><i class="bi bi-arrow-left-right"></i></button><button class="btn kecil" id="btnBukaFolder"><i class="bi bi-folder2-open"></i><span data-t="buka"></span></button></div>
          <div class="pg-baris"><img src="assets/brand/ikon-studio.svg" alt=""><div class="nm"><span><span data-t="versi"></span> <span id="versiApp">–</span></span><small>© Orulabs</small></div><button class="btn kecil" id="btnCekUpdate"><i class="bi bi-arrow-repeat"></i><span data-t="cekUpdate"></span></button></div>
        </div>
        <div class="update-info" id="infoUpdate" hidden>
          <div><b id="judulUpdate"></b><small id="catatanUpdate"></small></div>
          <button class="btn primary kecil" id="btnPasangUpdate"><i class="bi bi-download"></i><span data-t="updateSekarang"></span></button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="mv-pop" id="mvPop" hidden>
  <h4><i class="bi bi-stars"></i><span data-t="magicVocal"></span><button class="mv-tutup" id="mvTutup"><i class="bi bi-x-lg"></i></button></h4>
  <div class="sub" data-t="mvSub"></div>
  <div class="mv-kunci"><i class="bi bi-music-note-beamed"></i><div class="mv-kunci-teks"><b id="mvKunci"></b><small id="mvKunciKet"></small></div><div class="dd kecil" id="ddKunci"></div></div>
  <div class="mv-tingkat" id="mvTingkat">
    <div data-tk="natural"><i class="bi bi-feather"></i><b data-t="mvNatural"></b><span data-t="mvNaturalK"></span></div>
    <div data-tk="pop"><i class="bi bi-gem"></i><b data-t="mvPop"></b><span data-t="mvPopK"></span></div>
    <div data-tk="autotune"><i class="bi bi-robot"></i><b data-t="mvAuto"></b><span data-t="mvAutoK"></span></div>
  </div>
  <div class="mv-kuat"><span data-t="mvKekuatan"></span><input type="range" id="mvKekuatan" min="0" max="100" step="5" value="85"><b id="mvKekuatanNilai">85%</b></div>
  <div class="mv-langkah">
    <div><i class="bi bi-music-note"></i><span><span data-t="mvL1"></span><small data-t="mvL1K"></small></span><span class="sw" data-lk="nada"></span></div>
    <div><i class="bi bi-activity"></i><span><span data-t="mvL2"></span><small data-t="mvL2K"></small></span><span class="sw" data-lk="dinamika"></span></div>
    <div><i class="bi bi-mic"></i><span><span data-t="mvL3"></span><small data-t="mvL3K"></small></span><span class="sw" data-lk="rantai"></span></div>
    <div><i class="bi bi-vinyl"></i><span><span data-t="mvL4"></span><small data-t="mvL4K"></small></span><span class="sw" data-lk="master"></span></div>
  </div>
  <button class="mv-go" id="mvProses"><i class="bi bi-magic"></i><span data-t="mvProses"></span></button>
  <i class="mv-panah" id="mvPanah"></i>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
