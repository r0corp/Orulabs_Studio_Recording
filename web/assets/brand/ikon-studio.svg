<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Ikon Orulabs Studio Recording (konsep A): headset studio dengan mic, gelombang suara di tengah.
       Warna Orulabs: navy #16325c, biru #0d8ef0, biru muda #29c5f6, oranye #f47b20, latar putih. -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#ffffff"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#0d8ef0" stroke-opacity=".2"/>
  <!-- bando headset -->
  <path d="M28 74V62a36 36 0 0 1 72 0v12" fill="none" stroke="#16325c" stroke-width="7" stroke-linecap="round"/>
  <!-- bantalan telinga -->
  <rect x="20" y="66" width="20" height="32" rx="9" fill="#0d8ef0"/>
  <rect x="88" y="66" width="20" height="32" rx="9" fill="#0d8ef0"/>
  <!-- tangkai mic + kepala mic oranye -->
  <path d="M30 98c0 10 10 14 22 14h6" fill="none" stroke="#16325c" stroke-width="5" stroke-linecap="round"/>
  <circle cx="62" cy="112" r="6" fill="#f47b20"/>
  <!-- gelombang suara -->
  <path d="M52 64v14M60 56v30M68 60v22M76 66v10" stroke="#29c5f6" stroke-width="5" stroke-linecap="round"/>
</svg>
